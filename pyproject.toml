[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vesperui"
dynamic = ["version"]
description = "Native Windows widgets with an evening glow."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Giuseppe Cigala" }]
keywords = [
    "gui",
    "win32",
    "windows",
    "widgets",
    "ctypes",
    "desktop",
    "audio",
    "dark-theme",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Widget Sets",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "twine>=4.0",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/GiuseppeCigala/vesperui"
Documentation = "https://github.com/GiuseppeCigala/vesperui/tree/main/docs"
Repository = "https://github.com/GiuseppeCigala/vesperui"
Issues = "https://github.com/GiuseppeCigala/vesperui/issues"
Changelog = "https://github.com/GiuseppeCigala/vesperui/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "vesperui.__version__" }

[tool.setuptools.packages.find]
include = ["vesperui*"]
exclude = ["tests*", "docs*", "examples*"]
